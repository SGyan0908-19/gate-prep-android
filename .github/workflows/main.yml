name: Build GATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project ZIP
        run: |
          test -f GATE_APK_Build_Project.zip
          unzip -l GATE_APK_Build_Project.zip

      - name: Extract project
        run: |
          mkdir -p buildsrc
          unzip -q GATE_APK_Build_Project.zip -d buildsrc
          find buildsrc -maxdepth 5 -type f | sort
          test -f buildsrc/gate_android_build/settings.gradle
          test -f buildsrc/gate_android_build/app/build.gradle

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p buildsrc/gate_android_build \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GATE-Prep-APK
          path: buildsrc/gate_android_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
