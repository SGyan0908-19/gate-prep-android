plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.gateprep.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gateprep.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.5.8'
    }
}

python {
    version '3.10'
    pip {
        install 'flask==3.1.1'
    }
}
