name: Build GATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms" || true
          ls -la "${ANDROID_HOME}" || true
          command -v sdkmanager || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project ZIP
        run: |
          test -f GATE_APK_Build_Project.zip
          unzip -l GATE_APK_Build_Project.zip

      - name: Extract Android project
        run: |
          mkdir -p buildsrc
          unzip -q GATE_APK_Build_Project.zip -d buildsrc
          test -f buildsrc/gate_android_build/settings.gradle
          test -f buildsrc/gate_android_build/app/build.gradle

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p buildsrc/gate_android_build \
            assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GATE-Prep-APK
          path: buildsrc/gate_android_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
