name: Build GATE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Android project structure"
          find . -maxdepth 4 -type f | sort
          test -f settings.gradle
          test -f build.gradle
          test -f AndroidManifest.xml
          test -f MainActivity.java

      - name: Upload project inspection
        uses: actions/upload-artifact@v4
        with:
          name: gate-project-inspection
          path: .
          retention-days: 1
