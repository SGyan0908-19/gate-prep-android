<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/icons/icon-192.png">
<title>GATE Practice</title>
<style>
:root{--bg:#f6f7fb;--fg:#15171c;--card:#fff;--mut:#667;--bd:#d9dce6;--ac:#3b6cf6;--ok:#1a9d55;--bad:#d33;--mk:#8a4fd8;--wr:#f0a020}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--fg:#e9eaee;--card:#1a1d24;--mut:#9aa;--bd:#2c313c;--ac:#6b93ff;--ok:#3ec47b;--bad:#ff6b6b;--mk:#b48cf0;--wr:#f5b84d}}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
#main{max-width:640px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom));min-width:0}
body.exam #main{padding-bottom:12px}body.exam nav{display:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--mut);padding:8px 2px;font-size:11px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;border-radius:0}
nav button span{font-size:20px;line-height:1}nav button[aria-current=page]{color:var(--ac);font-weight:600}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.25}h2{font-size:20px}h3{font-size:16px}p{margin:.4em 0}small,.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;overflow-wrap:anywhere;min-width:0}
button,select,input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:3px 0;max-width:100%;min-height:44px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.gh{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.dg{background:var(--bad)}button.pri{background:var(--ac)}
button:disabled{opacity:.5}input[type=file]{width:100%;font-size:14px}input,select,textarea{width:100%}input[type=number]{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{width:100%;margin:0}
label{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.hero{background:var(--ac);color:#fff;border-radius:14px;padding:14px;margin:10px 0}.hero .big{font-size:34px;font-weight:700}.hero small{color:#fffc}
.bar{background:var(--bd);border-radius:6px;height:10px;overflow:hidden}.bar i{display:block;height:10px;background:var(--ac)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sum div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.sum b{display:block;font-size:20px}
.empty{text-align:center;padding:20px 12px}.err{border-color:var(--bad)}.load{padding:30px;text-align:center;color:var(--mut)}
.hd{display:flex;align-items:center;gap:8px;margin:2px 0 6px}.hd h2{margin:0;flex:1;min-width:0}.ib{width:44px;padding:0;background:transparent;color:var(--fg);border:1px solid var(--bd);margin:0;flex:none}
.xa{display:flex;flex-direction:column;min-height:calc(100vh - 24px)}.xt{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:3}
.xq{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.tmr{font-variant-numeric:tabular-nums;font-weight:700}.tmr.low{color:var(--bad)}
.xs{color:var(--mut);font-size:13px;margin:4px 0}.qt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.5;margin:8px 0 12px}.hint{font-size:13px;color:var(--mut);margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--bd);margin:6px 0;padding:10px 12px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt span{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}.opt.on b{background:var(--ac);color:#fff;border-color:var(--ac)}
.xb{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(6px + env(safe-area-inset-bottom));margin-top:auto;display:grid;gap:6px}.xb button{margin:0}.xb .sub{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sh{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.shh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}.pal button{margin:0;padding:0;background:var(--bg);color:var(--fg);border:1.5px solid var(--bd)}
.pal .a{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .m{background:var(--mk);color:#fff;border-color:var(--mk)}.pal .v{border-color:var(--wr)}.pal .c{outline:3px solid var(--ac)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 14px;border-radius:10px;z-index:20;max-width:90%;font-size:14px;display:none}
.ok{color:var(--ok)}.bd{color:var(--bad)}.det{border-top:1px solid var(--bd);margin-top:8px;padding-top:8px;white-space:pre-wrap}.det .t{white-space:pre-wrap}
a{color:var(--ac)}.lst>div{padding:6px 0;border-bottom:1px solid var(--bd)}.lst>div:last-child{border-bottom:0}
.hm{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:6px 0}.hm i{aspect-ratio:1;border-radius:3px;background:var(--bg);border:1px solid var(--bd)}.hm i.u{background:repeating-linear-gradient(45deg,var(--bd) 0 3px,transparent 3px 6px);border-style:dashed}.hm i.l1{background:color-mix(in srgb,var(--ok) 30%,var(--bg))}.hm i.l2{background:color-mix(in srgb,var(--ok) 55%,var(--bg))}.hm i.l3{background:color-mix(in srgb,var(--ok) 80%,var(--bg))}.hm i.l4{background:var(--ok)}details summary{min-height:32px}

/* v0.5.5 mobile-first visual system */
:root{--bg:#f3f5fb;--fg:#171a25;--card:#fff;--mut:#667085;--bd:#e1e5ef;--ac:#4f46e5;--ok:#15803d;--bad:#dc2626;--mk:#7c3aed;--wr:#d97706;--shadow:0 5px 20px #1c2a4a0b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#eef2ff;--card:#121a2c;--mut:#a6b0c5;--bd:#26324a;--ac:#8b9cff;--ok:#4ade80;--bad:#fb7185;--mk:#c4a7ff;--wr:#fbbf24;--shadow:0 5px 20px #0003}}
body{background:radial-gradient(ellipse at top left,color-mix(in srgb,var(--ac) 5%,var(--bg)),var(--bg) 55%);letter-spacing:.005em}
#main{max-width:720px;padding:14px 14px calc(94px + env(safe-area-inset-bottom))}
.card{border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;background:var(--card);box-shadow:var(--shadow)}
.hd{padding:8px 2px 5px}.hd h2{font-size:23px;letter-spacing:-.035em;font-weight:800}
.hero{border-radius:22px;padding:20px;background:linear-gradient(135deg,#4f46e5,#7168f4 60%,#9b8afb);box-shadow:0 12px 30px #4f46e533}.hero .big{font-size:42px;line-height:1.08;letter-spacing:-.05em}
button{border-radius:12px;font-weight:650;min-height:44px;padding:10px 14px;transition:transform .12s ease,filter .12s ease}button:active{transform:scale(.985)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 60%,transparent);outline-offset:2px}
button.gh{border-radius:12px}input,select,textarea{border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:11px 12px;min-height:44px;font:inherit}textarea{min-height:96px}label{font-weight:600;font-size:12px;letter-spacing:.025em;text-transform:uppercase;margin-top:12px}
nav{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--bd);box-shadow:0 -6px 24px #1523440b;padding-top:4px}
nav button{font-size:11px;font-weight:650;gap:4px;min-height:60px}nav button[aria-current=page]{color:var(--ac);position:relative}nav button[aria-current=page]:before{content:"";height:3px;width:26px;border-radius:9px;background:var(--ac);position:absolute;top:0}
.sum div{border:1px solid var(--bd);padding:12px 8px;border-radius:14px}.bar{height:8px;border-radius:9px}.bar i{height:8px;border-radius:9px}.empty{border-style:dashed}.load{padding:40px 16px}.ov{backdrop-filter:blur(5px)}.sh{border:1px solid var(--bd);box-shadow:0 -14px 45px #0002;border-radius:22px 22px 0 0}.shh{position:sticky;top:-14px;background:var(--card);padding:8px 0;z-index:2}
.opt{border-radius:14px;padding:12px}.opt.on{box-shadow:0 0 0 1px var(--ac) inset}.lst>div{padding:10px 0}.hm{gap:4px}.hm i{border-radius:4px}
@media(min-width:560px){#main{padding-left:18px;padding-right:18px}.sum{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<main id=main></main>
<nav id=nav aria-label="Main">
<button data-t=home data-act=tab><span>🏠</span>Home</button><button data-t=practice data-act=tab><span>✏️</span>Practice</button><button data-t=mocks data-act=tab><span>⏱</span>Mocks</button><button data-t=revision data-act=tab><span>🔁</span>Revision</button><button data-t=tracker data-act=tab><span>📊</span>Tracker</button>
</nav><div id=toast role=status aria-live=polite></div><div id=sheet></div>
<script>
const LET='ABCDEFGH',ET=['conceptual','forgotten formula','calculation','silly mistake','question misread','wrong approach','time management','blind guess','other'];
const $=s=>document.querySelector(s),M=()=>$('#main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
async function j(u,o){const r=await fetch(u,o);let d=null;try{d=await r.json()}catch(e){}if(r.status>=500||(d===null&&!r.ok))throw new Error((d&&d.error)||'Server error '+r.status);return d}
const P=(u,b,m='POST')=>j(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let S=null,ans={},fl={},tm={},i=0,el=0,t0=0,tick=null,vis=new Set(),CUR=null,RB=null,RES=null;
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',ms)}
function sheet(h){$('#sheet').innerHTML=h?`<div class=ov data-act=ovclose><div class=sh role=dialog>${h}</div></div>`:''}
function setNav(t){document.querySelectorAll('nav button').forEach(b=>b.dataset.t===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}
function stopTimer(){clearInterval(tick);tick=null;clearInterval(ST)}
async function screen(tab,fn){CUR=()=>screen(tab,fn);stopTimer();S=null;sheet('');document.body.classList.remove('exam');setNav(tab);M().innerHTML='<div class=load>Loading…</div>';window.scrollTo(0,0);try{await fn()}catch(e){fail(e)}}
function fail(e){M().innerHTML=`<div class="card err"><b>Something went wrong</b><p>${esc(e&&e.message||e)}</p><button data-act=retry>Retry</button></div>`}
const hdr=(t,back)=>`<div class=hd>${back?`<button class=ib aria-label=Back data-act=back data-to=${back}>←</button>`:''}<h2>${t}</h2></div>`;
const bar=(v,m)=>`<div class=bar><i style="width:${m?Math.min(100,100*v/m):0}%"></i></div>`;
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const examDate=()=>LS.get('gate_exam_date','2027-02-06');
const sel=(id,opts,first)=>`<select id=${id}><option value="">${first}</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
/* ---------- HOME ---------- */
async function home(){let[s,act,an,ex,dh]=await Promise.all([j('/api/stats'),j('/api/sessions/active'),j('/api/analytics'),j('/api/tracker/exam'),j('/api/tracker/dashboard')]);
 if(ex.source==='default'){const v=LS.get('gate_exam_date',null);if(v)try{const r=await P('/api/tracker/exam',{date:v,tz:ex.tz,status:'provisional'});if(!r.error)ex=r}catch(e){}}
 const d=ex.date,days=Math.max(0,ex.days_remaining),sec=Object.fromEntries(an.today_by_section.map(x=>[x.section,x.n]));
 M().innerHTML=`<div class=hero><span class=big>${days}</span> days to GATE 2027<br><small>Exam date ${esc(d)} · ${esc(ex.label)}${ex.passed?' · date has passed':''} (change in Settings)</small></div>`+
 `<div class=card><div class=row><span style=flex:1><b>Study today: ${fm(dh.today.minutes)}</b>${dh.today.goal_hours?' <small>/ goal '+dh.today.goal_hours+'h</small>':''}<br><small>${dh.tracking_since?'tracking since '+esc(dh.tracking_since):'no study time logged yet'}</small></span><button data-act=go-study>⏱ Timer</button></div></div>`+
 (s.total_questions==0?`<div class="card empty"><h3>No questions yet</h3><p class=mut>Try the app with sample content, or import your own question file.</p><button data-act=demo>Load 3 demo questions</button><br><button class=gh data-act=goto-backup>Import questions</button></div>`:'')+
 (act.length?`<div class=card><b>Continue where you left off</b>${act.map(a=>`<div class=row style="margin-top:6px"><span style="flex:1">${esc(a.title)} · ${esc(a.mode)}<br><small>${a.answered}/${a.n} answered</small></span><button data-act=resume data-id=${a.id}>Resume</button><button class="gh ib" aria-label=Discard data-act=discard data-id=${a.id}>✕</button></div>`).join('')}</div>`:'')+
 `<div class=card><b>Daily targets</b>${Object.entries(s.targets).map(([k,v])=>`<div style="margin-top:6px">${esc(k)}: ${sec[k]||0}/${v}${bar(sec[k]||0,v)}</div>`).join('')}</div>
 <div class=card><b>Today</b><div class=sum style="margin-top:6px"><div><b>${s.today.a}</b><small>attempted</small></div><div><b>${s.today.c}</b><small>correct</small></div><div><b>${(+s.today.m).toFixed(2)}</b><small>marks</small></div><div><b>${s.streak}d</b><small>streak</small></div></div>
 <small>Unique questions: ${s.unique_questions} · 1st-attempt accuracy ${s.first_attempt_acc}% → latest ${s.latest_acc}%</small></div>
 <div class=card><div class=row><b style="flex:1">Revision due: ${s.due_revisions}</b>${s.due_revisions?`<button data-act=startrev>Start revision</button>`:''}</div></div>
 <div class=card><b>Weak topics</b><div class=lst>${s.weak_topics.map(w=>`<div>${esc(w.topic||w.subject)}: ${w.acc}%</div>`).join('')||'<small>none yet</small>'}</div></div>`}
/* ---------- PRACTICE ---------- */
async function practice(){const subs=await j('/api/subjects');
 M().innerHTML=`${hdr('Practice')}<div class=card><label for=ps>Subject</label>${sel('ps',subs.map(x=>x.name),'All subjects')}<label for=pt>Topic</label>${sel('pt',[],'All topics')}
 <div class=g2><div><label for=pst>Status</label><select id=pst><option value="">Any</option><option value=unattempted>Unattempted</option><option value=wrong>Previously wrong</option></select></div><div><label for=pty>Type</label><select id=pty><option value="">Any</option><option>MCQ</option><option>MSQ</option><option>NAT</option></select></div></div>
 <div class=g2><div><label for=pn>Questions</label><input id=pn type=number inputmode=numeric min=1 max=200 value=10></div><div><label for=pm>Minutes (0 = untimed)</label><input id=pm type=number inputmode=numeric min=0 max=600 value=0></div></div>
 <button data-act=pstart style="width:100%;margin-top:10px">Start</button></div><button class=gh style="width:100%" data-act=bank>Browse question bank</button>`}
async function loadTopics(selId,subj){const t=await j('/api/topics?subject='+encodeURIComponent(subj||''));$('#'+selId).innerHTML='<option value="">All topics</option>'+t.map(x=>`<option>${esc(x)}</option>`).join('')}
function pstart(){const m=+$('#pm').value||0;startSession({mode:m>0?'timed':'practice',subject:$('#ps').value,topic:$('#pt').value,status:$('#pst').value,qtype:$('#pty').value,limit:+$('#pn').value||10,duration_min:m,title:$('#ps').value||'Mixed'})}
async function startSession(b){const r=await P('/api/sessions',b);if(r.error)return toast(r.error);resume(r.id)}
/* ---------- MOCKS ---------- */
async function mocks(){const h=await j('/api/sessions/history'),t=h.filter(x=>x.mode==='timed'||x.mode==='mock'),o=h.filter(x=>x.mode!=='timed'&&x.mode!=='mock').slice(0,5);
 const row=x=>`<div class=row><span style="flex:1;min-width:0">${esc(x.title)}<br><small>${esc((x.finished||'').slice(0,16).replace('T',' '))} · ${x.n} Qs${x.duration?' · '+Math.round(x.duration/60)+' min':''}</small></span><b>${x.total==null?'–':(+x.total).toFixed(2)+'/'+x.max}</b><button class=gh data-act=viewres data-id=${x.id}>View</button></div>`;
 const fs=await j('/api/mocks/full/status');
 M().innerHTML=`${hdr('Mocks')}<div class=card><b>Full GATE CSE mock</b><p>65 questions · 100 marks · 3 hours</p><p class=mut>GATE 2027 CS pattern: General Aptitude 10 / 15 marks, Engineering Mathematics 9 / 13 marks, CSE subject 46 / 72 marks. Uses your imported question bank; it will not invent missing PYQs.</p>${fs.ready?'<button data-act=fullmock style="width:100%">Start full GATE mock</button>':'<button disabled style="width:100%;opacity:.55">Question bank incomplete</button>'}<details><summary>Question bank readiness</summary><div class=lst>${Object.entries(fs.pools).map(([k,v])=>`<div>${esc(k.replaceAll('_',' '))}: ${v.available}/${v.required} available</div>`).join('')}</div><small>Import verified questions tagged to General Aptitude, Engineering Mathematics, or CSE Core, with the correct 1- or 2-mark value.</small></details></div><div class=card><b>Quick timed test</b><div class=g2><div><label for=mn>Questions</label><input id=mn type=number inputmode=numeric value=10 min=1></div><div><label for=mm>Minutes</label><input id=mm type=number inputmode=numeric value=20 min=1></div></div><button data-act=mstart style="width:100%;margin-top:8px">Start timed test</button></div>
 <div class=card><b>Past timed tests</b><div class=lst>${t.map(row).join('')||'<small>None yet</small>'}</div></div>`+(o.length?`<div class=card><b>Recent untimed practice</b><div class=lst>${o.map(row).join('')}</div></div>`:'')}
/* ---------- REVISION ---------- */
async function revision(){const[r,s]=await Promise.all([j('/api/revision'),j('/api/stats')]);
 M().innerHTML=`${hdr('Revision')}<div class=card><div class=row><b style="flex:1">Due now: ${s.due_revisions}</b>${s.due_revisions?`<button data-act=startrev>Start revision</button>`:''}</div><div class=g2 style="margin-top:10px"><button data-act=notes>📒 Study notebook</button><button class=gh data-act=goto-mistakes>⚠️ Mistake log</button></div></div>
 <div class=card><b>Upcoming spaced revision</b><div class=lst>${r.map(x=>`<div>Q${x.qid} · ${esc(x.subject)}${x.topic?' › '+esc(x.topic):''}<br><small class="${x.overdue?'bd':''}">${x.overdue?'Due now':'Due '+esc(x.due.slice(0,10))} · stage ${x.stage+1}</small></div>`).join('')||'<small>Nothing queued. Wrong answers are queued automatically.</small>'}</div></div><div class=card><b>Export your notes</b><p class=mut>Download a JSON copy of your personal study notebook.</p><a href="/api/export/notes.json" download="gate-study-notes.json">Export notes (JSON)</a></div>`}
/* ---------- OPTIONAL AI STUDY ASSISTANT ---------- */
async function aiScreen(){const st=await j('/api/ai/status');M().innerHTML=`${hdr('AI study assistant','tracker')}<div class=card><b>Ask for help with GATE CSE</b><p class=mut>Generate explanations, option-wise reasoning, formula sheets, revision notes, weak-topic quizzes or next-day plans. AI output is study assistance, not verified PYQ content.</p><div class="${st.configured?'ok':'mut'}">${st.configured?'Server API key detected':'No server API key detected'} · default model: ${esc(st.default_model)}</div><label for=aikey>API key (optional, request only)</label><input id=aikey type=password autocomplete=off placeholder="Not stored by this app"><small>Leave blank to use GATE_AI_API_KEY configured on the server. The key entered here is sent only with your request and is not saved in SQLite or backups.</small><label for=aibase>OpenAI-compatible API base URL</label><input id=aibase value="${esc(st.base_url)}" placeholder="https://api.openai.com/v1"><label for=aimodel>Model</label><input id=aimodel value="${esc(st.default_model)}" placeholder="gpt-4o-mini"><label for=aitask>Task</label><select id=aitask><option value="Explain this concept step by step for GATE CSE, with a small example and common traps: ">Explain concept</option><option value="Explain each option and why it is correct or incorrect. Preserve the supplied question wording: ">Option-wise explanation</option><option value="Create concise A4-style revision notes with formulas, diagrams described in text, edge cases and common GATE traps for: ">Revision notes</option><option value="Create 10 original GATE-style practice questions with answers and explanations. Clearly label them AI-generated, not official PYQs: ">Generate practice questions (not PYQs)</option><option value="Make a short weak-topic quiz with answers hidden until a separate answer key at the end for: ">Weak-topic quiz</option><option value="Create a realistic next-day study plan using these constraints and priorities: ">Study plan</option></sel async function resume(id){let v;try{v=await j('/api/sessions/'+id)}catch(e){return toast('Could not open session')}if(v.error||v.status!=='active')return toast(v.error||'Session already submitted');
 S=v;ans=S.answers||{};fl=S.flags||{};tm=S.times||{};i=Math.min(S.idx||0,S.questions.length-1);el=S.elapsed||0;S.startedAt=Date.now()-el*1000;vis=new Set([i]);stopTimer();t0=Date.now();CUR=null;document.body.classList.add('exam');sheet('');window.scrollTo(0,0);tick=setInterval(onTick,1000);exam()}
function onTick(){if(S.duration)el=Math.floor((Date.now()-(S.startedAt||Date.now()))/1000);else el++;tmrUpd();if(S.duration&&S.duration-el<=0){stopTimer();toast('Time up – submitting');doSubmit()}else if(el%10==0)save()}
function tmrUpd(){const T=$('#tmr');if(!T||!S)return;if(S.duration){const r=S.duration-el;T.textContent='⏱ '+mmss(r);T.classList.toggle('low',r<=60)}else T.textContent='⏱ '+mmss(el)}
const save=()=>S?P('/api/sessions/'+S.id,{answers:ans,flags:fl,times:tm,idx:i,elapsed:el},'PUT').catch(()=>{}):Promise.resolve();
function leave(){const q=S.questions[i];tm[q.id]=(tm[q.id]||0)+Math.round((Date.now()-t0)/1000);t0=Date.now()}
function exam(){const q=S.questions[i],a=ans[q.id]||'',n=S.questions.length;vis.add(i);
 M().innerHTML=`<div class=xa><div class=xt><button class=ib aria-label="Save and exit" data-act=exit>✕</button><div class=xq><b>Q${i+1}/${n}</b><small>${q.qtype} · ${q.marks} ${q.marks==1?'mark':'marks'}</small></div><span id=tmr class=tmr></span><button class=ib aria-label=Palette data-act=pal>▦</button></div>
 <div class=xs>${esc(q.subject)}${q.topic?' › '+esc(q.topic):''}${q.year?' · '+q.year:''}${q.is_demo?' · DEMO':''}</div><div class=qt>${esc(q.text)}</div>
 ${q.qtype=='NAT'?`<input id=nat inputmode=decimal autocomplete=off placeholder="Enter numeric answer" value="${esc(a)}">`:`<div class=hint>${q.qtype=='MCQ'?'Select one option':'Select all correct options'}</div>`+q.options.map((o,k)=>`<button class="opt${a.split(',').includes(LET[k])?' on':''}" data-act=opt data-l=${LET[k]}><b>${LET[k]}</b><span>${esc(o)}</span></button>`).join('')}
 <div class=xb><div class=g2><button class=gh data-act=prev>Previous</button><button data-act=next>Save &amp; Next</button></div><div class=g2><button class=gh data-act=clear>Clear Response</button><button class=gh data-act=mark>Mark for Review &amp; Next</button></div><button class=sub data-act=submitask>Submit</button></div></div>`;tmrUpd()}
function pick(L){const q=S.questions[i];if(q.qtype=='MCQ')ans[q.id]=L;else{let s=(ans[q.id]||'').split(',').filter(x=>x);s=s.includes(L)?s.filter(x=>x!=L):[...s,L].sort();ans[q.id]=s.join(',')}exam()}
function goq(k){if(k<0||k>=S.questions.length){toast(k<0?'First question':'Last question');return}leave();i=k;save();exam();window.scrollTo(0,0)}
function palette(){sheet(`<div class=shh><b>Question palette</b><button class=ib aria-label=Close data-act=closeSheet>✕</button></div><div class=pal>${S.questions.map((x,k)=>{const c=[ans[x.id]?'a':'',fl[x.id]&&!ans[x.id]?'m':'',!ans[x.id]&&!fl[x.id]&&vis.has(k)?'v':'',k==i?'c':''].join(' ');return`<button class="${c}" data-act=goto data-k=${k}>${k+1}${fl[x.id]?'⚑':''}</button>`}).join('')}</div><div class=leg><span>🟩 answered</span><span>🟪 marked</span><span>🟧 seen, no answer</span><span>⬜ not visited</span></div>`)}
function submitAsk(){const n=S.questions.length,a=S.questions.filter(x=>ans[x.id]).length,m=S.questions.filter(x=>fl[x.id]).length;sheet(`<b>Submit test?</b><p>Answered ${a} of ${n} · Marked ${m} · Unanswered ${n-a}</p><p class=mut>You cannot change answers after submitting.</p><div class=g2><button class=gh data-act=closeSheet>Keep going</button><button class=dg data-act=submit>Yes, submit</button></div>`)}
async function doSubmit(){if(!S)return;sheet('');stopTimer();leave();let r;try{r=await P(`/api/sessions/${S.id}/submit`,{answers:ans,times:tm});if(r.error)throw new Error(r.error)}catch(e){toast('Could not submit – your answers are kept. Try again.',4000);if(!tick)tick=setInterval(onTick,1000);return}
 const done={qs:S.questions,ans:{...ans},el,id:S.id};S=null;document.body.classList.remove('exam');results(r,done,true)}

 ${wrong.includes(x)?`<select id=e${x.attempt_id}><option value="">Error type…</option>${ET.map(t=>`<option>${esc(t)}</option>`).join('')}</select><textarea id=n${x.attempt_id} rows=2 placeholder="My notes"></textarea>`:''}</div>`}).join('')+
 (fresh?`<button data-act=savenotes style="width:100%">${wrong.length?'Save notes':'Done'}</button>`:'');}

 try{if(items.length)await P('/api/annotate',{items})}catch(e){return toast('Could not save notes – try again')}screen('home',home)}

 $('#bl').insertAdjacentHTML('beforeend',r.map(q=>`<div class=card data-act=bopen data-id=${q.id}><small>#${q.id} · ${esc(q.subject)}${q.topic?' › '+esc(q.topic):''} · ${q.qtype} ${q.marks}m${q.year?' · '+q.year:''}${q.qno?' '+esc(q.qno):''}${q.is_demo?' · DEMO':''} · tried ${q.n_att}×</small><div style="white-space:pre-wrap">${esc(q.text.slice(0,140))}</div></div>`).join(''));BF.offset+=r.length;

async function bopen(id,el){if(el.dataset.open){el.querySelector('.det')?.remove();delete el.dataset.open;return}el.dataset.open=1;const [q,f]=await Promise.all([j('/api/questions/'+id),j('/api/questions/'+id+'/flags')]);
 el.insertAdjacentHTML('beforeend',`<div class=det><div class=t>${esc(q.text)}</div>${q.options.map((o,k)=>`<div>${LET[k]}. ${esc(o)}</div>`).join('')}<div class=row><button class=gh data-act=qflag data-id=${q.id} data-flag=bookmarked data-value=${f.bookmarked?0:1}>${f.bookmarked?'★ Bookmarked':'☆ Bookmark'}</button><button class=gh data-act=qflag data-id=${q.id} data-flag=difficult data-value=${f.difficult?0:1}>${f.difficult?'✓ Difficult':'Mark difficult'}</button><button class=gh data-act=qflag data-id=${q.id} data-flag=guessed data-value=${f.guessed?0:1}>${f.guessed?'✓ Guessed':'Mark guessed'}</button></div><label>Personal note</label><textarea id=fn${q.id} rows=2 placeholder="What did you miss?">${esc(f.personal_note||'')}</textarea><button class=gh data-act=qflag-note data-id=${q.id}>Save note</button><div class=row><button class=gh data-act=qedit data-id=${q.id}>Edit</button><button class=gh data-act=qdelete data-id=${q.id}>Delete</button><button class=gh data-act=bans>Show answer</button></div><div hidden>Answer: <b>${esc(q.answer)}</b>${q.qtype=='NAT'&&q.tolerance?' (±'+q.tolerance+')':''}<br>${esc(q.explanation||'')}</div><div><small>Attempts: ${q.history.length?q.history.map(h=>`${esc(h.ts.slice(0,10))} ${h.attempted?(h.correct?'✓':'✗'):'–'}${h.error_type?' ('+esc(h.error_type)+')':''}`).join(', '):'none'}</small></div></div>`)}

 const opts=q.options.map((v,k)=>`<label for=qo${k}>Option ${LET[k]}</label><input id=qo${k} value="${esc(v)}" placeholder="${q.qtype==='NAT'?'Not used for NAT':'Option '+LET[k]}">`).join('');
 sheet(`<div class=shh><b>${id?'Edit question #'+id:'Add question'}</b><button class=ib aria-label=Close data-act=closeSheet>✕</button></div>
 <label for=qe_subject>Subject</label><select id=qe_subject>${subs.map(x=>`<option${x.name===q.subject?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <label for=qe_topic>Topic</label><input id=qe_topic value="${esc(q.topic||'')}" placeholder="e.g. Cache mapping">
 <div class=g2><div><label for=qe_type>Question type</label><select id=qe_type><option${q.qtype==='MCQ'?' selected':''}>MCQ</option><option${q.qtype==='MSQ'?' selected':''}>MSQ</option><option${q.qtype==='NAT'?' selected':''}>NAT</option></select></div><div><label for=qe_marks>Marks</label><select id=qe_marks>${[1,2,3,4,5].map(n=>`<option value=${n}${+q.marks===n?' selected':''}>${n}</option>`).join('')}</select></div></div>
 <label for=qe_text>Question text</label><textarea id=qe_text rows=4 placeholder="Keep exact wording and notation">${esc(q.text)}</textarea>
 <div id=qe_options>${opts}</div><small>For MCQ/MSQ, enter each option separately. For NAT, options are ignored.</small>
 <label for=qe_answer>Correct answer</label><input id=qe_answer value="${esc(q.answer)}" placeholder="MCQ: B · MSQ: A,C · NAT: 12.5">
 <div class=g2><div><label for=qe_year>Year</label><input id=qe_year type=number min=1980 max=${new Date().getFullYear()+1} value="${esc(q.year||'')}" placeholder="2024"></div><div><label for=qe_qno>Question number</label><input id=qe_qno value="${esc(q.qno||'')}" placeholder="e.g. Q.17"></div></div>

 <label for=qe_diff>Difficulty</label><select id=qe_diff><option value="">Unspecified</option>${['Easy','Medium','Hard'].map(v=>`<option${q.difficulty===v?' selected':''}>${v}</option>`).join('')}</select>
 <label for=qe_expl>Explanation / solution</label><textarea id=qe_expl rows=3>${esc(q.explanation||'')}</textarea>

}

async function qsave(e){
 const type=$('#qe_type').value,options=[0,1,2,3].map(k=>$('#qo'+k)?.value.trim()||'').filter(Boolean);
 const b={subject:$('#qe_subject').value,topic:$('#qe_topic').value,text:$('#qe_text').value,qtype:type,marks:+$('#qe_marks').value,options,answer:$('#qe_answer').value.trim(),year:$('#qe_year').value||null,qno:$('#qe_qno').value,source:$('#qe_source').value,tolerance:$('#qe_tol').value||0,difficulty:$('#qe_diff').value,explanation:$('#qe_expl').value};
 if(type==='NAT')b.options=[];
 try{const id=e.dataset.id;const r=await P(id?'/api/questions/'+id:'/api/questions',b,id?'PUT':'POST');if(r.error){say('qemsg',r.error+(r.duplicate_id?' (duplicate #'+r.duplicate_id+')':''));return}sheet('');toast(id?'Question updated':'Question added');BF.subject=b.subject;BF.topic=b.topic;BF.offset=0;screen('practice',bank)}catch(err){say('qemsg','Save failed: '+err.message)}

async function qdelete(e){const id=+e.dataset.id;if(!confirm('Delete question #'+id+'? Attempt history will also be deleted only if you explicitly confirm the second prompt.'))return;try{let r=await j('/api/questions/'+id,{method:'DELETE'});if(r.error&&r.error.includes('attempt')){if(!confirm(r.error+'\n\nDelete question AND its attempt/revision history?'))return;r=await j('/api/questions/'+id+'?delete_history=1',{method:'DELETE'})}if(r.error)return toast(r.error,4500);toast('Question deleted');screen('practice',bank)}catch(err){toast('Delete failed: '+err.message,4500)}}

function backup(){setNav('tracker');CUR=()=>backup();RB=null;
 M().innerHTML=`${hdr('Backup, export &amp; restore','tracker')}<div class=card><b>Download</b><div class=lst><div><a href=/api/backup download=gate-backup.json>Full backup (JSON)</a></div><div><a href=/api/export/attempts.csv>Attempts CSV</a></div><div><a href=/api/export/questions.csv>Questions CSV</a></div></div></div>

async function importFile(el){if(!el.files[0])return;const f=new FormData();f.append('file',el.files[0]);try{const r=await j('/api/import',{method:'POST',body:f});$('#iw').innerHTML=r.error?`<p class=bd>${esc(r.error)}</p>`:`<p class=ok>Imported ${r.imported} questions.</p>${r.warning_count?`<p class=bd>${r.warning_count} warning(s) – these questions may score wrongly:</p><small>${r.warnings.map(esc).join('<br>')}</small>`:''}`}catch(e){$('#iw').innerHTML=`<p class=bd>Import failed: ${esc(e.message)}</p>`}}
async function rfile(el){if(!el.files[0])return;let d;try{d=JSON.parse(await el.files[0].text())}catch(e){$('#rv').innerHTML='<p class=bd>❌ Invalid backup: not valid JSON.</p>';return}
 try{const v=await P('/api/restore/validate',d);if(!v.ok){$('#rv').innerHTML=`<p class=bd>❌ Invalid backup:</p><small>${v.errors.map(esc).join('<br>')}</small>`;return}RB=d;
 $('#rv').innerHTML=`<p class=ok>✅ Valid backup. Rows (current → backup):</p><small>${Object.keys(v.backup).map(t=>`${esc(t)}: ${v.current[t]} → <b>${v.backup[t]}</b>`).join('<br>')}<br>Tables not in the file are left unchanged.</small><label for=rc>Type RESTORE to confirm</label><input id=rc autocomplete=off><button class=dg data-act=dorestore style="width:100%">Restore now</button><p id=rm class=bd role=alert></p>`}catch(e){$('#rv').innerHTML=`<p class=bd>Could not check file: ${esc(e.message)}</p>`}}
async function dorestore(){if($('#rc').value!=='RESTORE'){$('#rm').textContent='Type RESTORE exactly to confirm.';return}try{const r=await P('/api/restore',{confirm:true,data:RB});if(r.error){$('#rm').textContent=r.error+(r.errors?' '+r.errors.join('; '):'');return}toast('Restored. Safety copy: '+r.safety_copy,5000);screen('home',home)}catch(e){$('#rm').textContent='Restore failed, nothing changed: '+e.message}}
async function demo(){try{const r=await j('/api/demo',{method:'POST'});toast(r.imported?'Demo questions loaded':'Demo questions already loaded');if(!document.body.classList.contains('exam')&&M().querySelector('.empty'))screen('home',home)}catch(e){toast('Could not load demo questions')}}

const fm=m=>m==null?'—':(m>=60?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.round(m)+'m');
const KL={study:'Study (lectures/reading)',solving:'Question solving',mock:'Mock test'},td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const kopts=()=>Object.entries(KL).map(([k,v])=>`<option value=${k}>${v}</option>`).join(''),sopts=subs=>subs.map(s=>`<option>${esc(s.name)}</option>`).join('');
let ST=null,PD=null,PR=[],TASKS=[],SUBS=[];
const say=(id,t,ok)=>{const e=$('#'+id);if(e){e.textContent=t;e.className=ok?'ok':'bd'}};
async function T(u,b,m){const r=await P(u,b||{},m||'POST');return r}
const links=()=>`<div class=g2><button class=gh data-act=go-study>⏱ Timer &amp; time log</button><button class=gh data-act=go-progress>📚 Subject progress</button><button class=gh data-act=go-planner>🗓 Daily planner</button><button class=gh data-act=go-dash>📈 Dashboard &amp; reports</button></div>`;
async function study(){const[t,subs,d,l]=await Promise.all([j('/api/tracker/timer'),j('/api/subjects'),j('/api/tracker/dashboard'),j('/api/tracker/time?limit=15')]);SUBS=subs;const tm=t.timer;
 M().innerHTML=`${hdr('Study timer','tracker')}<div class=card>${tm?`<div class=row><b style=flex:1>${esc(tm.subject)}${tm.topic?' › '+esc(tm.topic):''}</b><small>${esc(KL[tm.kind])}</small></div><div class=big id=stm style="font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center">0:00</div><div class=mut style=text-align:center>${tm.status==='paused'?'⏸ Paused':'▶ Running'} · started ${esc(tm.started.slice(0,16).replace('T',' '))}</div>
 ${tm.stale?`<p class=bd>This timer has been running for over 12 hours. Probably forgotten - stop it and enter the minutes you actually studied.</p>`:''}
 <div class=g2>${tm.status==='running'?'<button data-act=tpause>⏸ Pause</button>':'<button data-act=tresume>▶ Resume</button>'}<button class=dg data-act=tstop data-stale=${tm.stale?1:0}>⏹ Stop &amp; save</button></div>`
 :`<b>Start a timer</b><label for=ts>Subject</label><select id=ts>${sopts(subs)}</select><label for=tt>Topic (optional)</label><input id=tt maxlength=120><label for=tk>Type of time</label><select id=tk>${kopts()}</select><button style="width:100%;margin-top:8px" data-act=tstart>▶ Start</button>`}<div id=tmsg role=status></div></div>
 <div class=card><div class=sum><div><b>${fm(d.today.minutes)}</b><small>today${d.today.goal_hours?' / goal '+d.today.goal_hours+'h':''}</small></div><div><b>${fm(d.week.minutes)}</b><small>this week${d.week.goal_hours?' / goal '+d.week.goal_hours+'h':''}</small></div><div><b>${d.streak_days}d</b><small>study streak</small></div><div><b>${d.tracking_since?esc(d.tracking_since.slice(5)):'—'}</b><small>tracking since</small></div></div>
 <small>Study, question-solving and mock time are tracked separately. Practice/test sessions in this app are measured separately and not added here.</small></div>
 <details class=card><summary><b>Add time manually</b></summary><label for=ms>Subject</label><select id=ms>${sopts(subs)}</select><label for=mt>Topic (optional)</label><input id=mt><label for=mk>Type</label><select id=mk>${kopts()}</select><label for=md>Day</label><input id=md type=date max="${td()}" value="${td()}"><label for=mm>Minutes</label><input id=mm type=number inputmode=numeric min=1 max=1440><label for=mst>Start time (optional - enables overlap check)</label><input id=mst type=time><button style="width:100%;margin-top:8px" data-act=madd>Add entry</button><div id=mmsg role=status></div></details>
 <div class=card><b>Recent entries</b><div class=lst>${l.map(x=>`<div><div class=row><span style=flex:1>${esc(x.subject)}${x.topic?' › '+esc(x.topic):''}<br><small>${esc(x.day)} · ${esc(KL[x.kind])} · ${x.source}${x.status!=='stopped'?' · '+x.status:''}</small></span><b>${fm(x.active_seconds/60)}</b>${x.status==='stopped'?`<button class="gh ib" aria-label="Edit minutes" data-act=tedit data-id=${x.id} data-m=${Math.round(x.active_seconds/60)}>✎</button><button class="gh ib" aria-label="Delete entry" data-act=tdel data-id=${x.id}>✕</button>`:''}</div></div>`).join('')||'<small>No time logged yet. This is "not recorded", not "zero".</small>'}</div></div>`;
 clearInterval(ST);if(tm){const base=tm.active_seconds,t0=Date.now();const u=()=>{const e=$('#stm');if(e)e.textContent=(()=>{const s=Math.round(base+(tm.status==='running'?(Date.now()-t0)/1000:0));return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')})()};u();if(tm.status==='running')ST=setInterval(u,1000)}}
async function tcall(u,b){try{const r=await T(u,b);if(r.error){toast(r.error,3500);return false}return true}catch(e){toast('Failed: '+e.message);return false}}
